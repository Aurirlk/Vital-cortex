# 智康云健康管理系统 - Loki 单机配置（日志聚合，保留 7 天）
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

# 2026-10-10 修复：上面只声明了 retention_period，但没有 compactor ——
# 在 Loki 里「保留期」是由 compactor 组件执行删除的，缺了它 retention 完全不生效，
# 数据会无限增长（与 DELIVERY.md「日志保留 7 天」的说法不符）。
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
