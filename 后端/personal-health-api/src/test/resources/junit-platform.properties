# JUnit 5 平台配置（2026-11-08 新增）
#
# 打开扩展自动发现：src/test/resources/META-INF/services/org.junit.jupiter.api.extension.Extension
# 里登记的实现会被自动注册到所有测试，无需每个测试类写 @ExtendWith。
#
# 当前登记的唯一扩展是 cn.kmbeast.support.IdentityCleanupExtension（身份 ThreadLocal 清场），
# 目的是消除测试间的执行顺序依赖 —— 见 CI 失败 LocalThreadHolderTest.unsetShouldReturnNull。
junit.jupiter.extensions.autodetection.enabled=true

# 明确保持串行执行：本项目大量测试依赖静态状态与真实文件路径，
# 并行化不是当前目标；顺序无关性由上面的清场扩展保证，而不是靠并行。
junit.jupiter.execution.parallel.enabled=false
