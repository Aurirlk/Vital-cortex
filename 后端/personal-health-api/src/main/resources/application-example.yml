# ============================================================
# 配置文件示例（复制为 application.yml 使用）
# ============================================================

server:
  port: 21090
  servlet:
    context-path: /api/personal-health/v1.0

my-server:
  api-context-path: /api/personal-health/v1.0

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/personal_health?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_DB_PASSWORD_HERE  # ← 修改为你的数据库密码
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.kmbeast.pojo.entity
  configuration:
    map-underscore-to-camel-case: true

# AI配置（API Key 在管理员后台配置，不要写在这里）
ai:
  provider: deepseek
  max-history-rounds: 10
  max-tokens: 4096
  vector-cache-dir: ./vector_cache

# 业务通知（2026-10-10 新增，实现见 core/notify/）
# 用户在设置页的开关存 user 表的 notify_* 列（迁移脚本 08），发送前统一查一次，
# 详见 docs/通知系统.md。下面这项不配置即用默认值。
notify:
  appointment-reminder:
    # 「就诊前一天提醒」定时任务的执行时间（Spring cron 六段式，秒 分 时 日 月 周）。
    # 默认每天 19:00；置为 "-" 可关闭本任务。
    # 注：排班只有 morning/afternoon/evening（无具体钟点），故只能按「天」提醒。
    cron: "0 0 19 * * ?"

# CRM 模块（机器对机器接口 + RAG 链路）
crm:
  # 本地开发可设为 false 跳过启动期强校验（不配置也能启动）。
  # 生产环境必须保持 true（默认值），未配置 crm.api-key 时应用拒绝启动。
  # 实际密钥通过环境变量 CRM_API_KEY / 配置 crm.api-key 注入，勿写入本文件。
  strict-startup: true
  api-key: YOUR_CRM_API_KEY_HERE  # ← 生产必填：openssl rand -hex 32 生成（≥24字符）
  embedding:
    api-url: YOUR_EMBEDDING_API_URL  # ← 生产必填：OpenAI 兼容 embeddings 端点（DeepSeek 无此接口）
    # 嵌入服务密钥：可与主 LLM 厂商不同（如 LLM=DeepSeek、embedding=硅基流动 BAAI/bge-m3），
    # 必须独立配置，否则会把主 LLM 的 key 发到 embedding 服务导致 401。为空时回退主 LLM 密钥。
    api-key: YOUR_EMBEDDING_API_KEY  # ← 建议配置：环境变量 EMBEDDING_API_KEY 注入
    model: BAAI/bge-m3  # ← 示例：硅基流动 bge-m3；或 text-embedding-v3（DashScope）

# 登录防撞库（2026-10-10 新增，实现见 core/auth/LoginAttemptGuard）
# 下列均为默认值，本地开发无需配置；生产可在 application-prod.yml 或环境变量里调整。
security:
  login:
    max-failures-per-account: 5    # 同一账号连续失败几次后临时封禁（跨 IP 累计）
    max-failures-per-ip: 30        # 同一 IP 累计失败几次后临时封禁（跨账号累计）
    failure-window-minutes: 15     # 失败计数的统计窗口
    lock-minutes: 15               # 封禁时长，到点自动解除
    # 是否启用「按 IP 封禁」（并从 X-Forwarded-For 取客户端地址）。
    # 默认 false = 只按账号封禁：后端在 nginx 之后时 remoteAddr 都是 nginx 容器 IP，
    # 按它封禁会让一个人失败 30 次就把全站用户锁在登录页外。
    # 置 true 的前提是把 21090 限制为仅 nginx / 内网可达（见 docker-compose.yml）。
    trusted-proxy: false

# Actuator 访问来源限制（2026-10-10 新增，实现见 Interceptor/ActuatorAccessInterceptor）
# /actuator/** 免鉴权是 Prometheus 抓取所必需的，但 21090 对外发布时
# 任何人都能读到 JVM / 连接池 / 全量 URI 指标。默认只放行回环与私有网段：
# Prometheus、nginx 都在容器内网（172.x），容器健康检查打 localhost，均不受影响；
# 公网直连读指标返回 404。判定只看 TCP 对端地址，不看可伪造的 X-Forwarded-For。
security:
  actuator:
    allow-private-only: true
