# ============================================
# 智康云前端 - Nginx 配置
# ============================================

server {
    listen 80;
    server_name localhost;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 2026-10-10 新增：屏蔽 Actuator 的公网访问。
    # 后端为了给 Prometheus 提供抓取指标，暴露了 /actuator/health 与
    # /actuator/prometheus，而 /actuator/** 在 JwtInterceptor 里是免鉴权的
    # （见 InterceptorConfig 的 excludePathPatterns）。
    # 下面那条 `location /api/` 会把整个 context-path 原样透传，
    # 于是任何人都能访问
    #   http://<站点>/api/personal-health/v1.0/actuator/prometheus
    # 拿到 JVM、连接池、HTTP 请求指标（HTTP 指标带全部 URI 标签，等于接口清单）。
    # Prometheus 是直连 backend:21090 抓取的、不经过本 nginx，所以这里封掉
    # 不影响监控面板与告警。
    # 注意：这只挡住经由 nginx（80 端口）的访问。绕开 nginx 直连 backend 的 21090
    # 那条路，2026-10-10 起由应用内的 ActuatorAccessInterceptor 兜底
    # （默认只放行回环/私有网段来源，见 application-prod.yml 的 security.actuator）；
    # 端口本身仍建议按 docker-compose.yml 的说明限制为仅 nginx/内网可达。
    location /api/personal-health/v1.0/actuator/ {
        return 404;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:21090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理
    # 2026-10-10 修复：原写法有两处错误，推送通知从未连通过。
    #   1) 端口写成 21091 —— 那是前端 dev-server 的端口；后端 Tomcat 只在 21090。
    #   2) 路径少了 context-path —— 后端 @ServerEndpoint 是
    #      /ws/notification/{token}，叠加 server.servlet.context-path 后
    #      真实地址是 /api/personal-health/v1.0/ws/notification/{token}。
    location /api/personal-health/v1.0/ws/ {
        proxy_pass http://backend:21090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket 是长连接，不能套用默认 60s 读超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://backend:21090;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
