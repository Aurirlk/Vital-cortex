# ============================================
# 智康云 - GitHub Actions CI/CD 流水线
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== 后端构建 ==========
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./后端/personal-health-api
        run: mvn clean compile -B

      - name: Run tests (unit + Spring context startup guard)
        working-directory: ./后端/personal-health-api
        # ⚠️ 必须是 verify，不能是 test（2026-11-08 修正）：
        # 单元测试走 surefire，而 *IT 后缀的 @SpringBootTest 启动守护被 surefire
        # 显式排除（见 pom.xml），只有 failsafe 在 verify 阶段才执行。
        # 此前这里写 mvn test，等于「启动守护一行都没跑」—— 应用起不来也发现不了。
        # 实测：上下文启动不依赖 MySQL/Redis/Neo4j（三者均懒连接），CI 裸机可直接跑。
        run: mvn verify -B

      - name: Package JAR
        working-directory: ./后端/personal-health-api
        run: mvn package -DskipTests -B

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 后端/personal-health-api/target/*.jar
          retention-days: 7

  # ========== 前端构建 ==========
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 前端/personal-heath-view/package-lock.json

      - name: Install dependencies
        working-directory: ./前端/personal-heath-view
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Lint
        working-directory: ./前端/personal-heath-view
        # ENG-05 整改：原 continue-on-error 让 lint 永远"假通过"。
        # 当前代码库从未 lint 过（44 errors / 23102 warnings，多为 CRLF 与 prettier 格式问题），
        # 直接阻塞流水线会让 CI 完全不可用。折中：先 --fix 自动修复，
        # 剩余 error 超出阈值则失败——后续逐步清零后收紧为 --max-warnings 0。
        run: npm run lint -- --fix --max-warnings 30000

      - name: Build
        working-directory: ./前端/personal-heath-view
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 前端/personal-heath-view/dist/
          retention-days: 7

  # ========== Docker 构建 ==========
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: 后端/personal-health-api/target/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: 前端/personal-heath-view/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔴 2026-11-08 修复：镜像 tag 必须小写，而 github.repository 是 "Aurirlk/Vital-cortex"（大写 A）。
      # buildx 直接报 invalid tag "...:latest": repository name must be lowercase。
      # 此前因为 frontend lint 常年红，docker-build 从未执行，所以这条一直没暴露。
      - name: 计算小写镜像名前缀
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./前端/personal-heath-view
          file: ./前端/personal-heath-view/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 部署前置检查 ==========
  # 🔴 2026-11-08 新增：secrets 不能在 job 级 if 里直接判断，故先用一个 job 探测。
  # 仓库当前 **未配置任何 secrets**（SERVER_HOST / SERVER_USER / SERVER_SSH_KEY 均为空），
  # 若照常跑 ssh-action 必然失败，且会把「部署未配置」伪装成「代码有问题」——
  # 整条流水线永远红，真失败就被淹没。这里改为：密钥齐全才部署，否则显式告警跳过。
  deploy-preflight:
    name: Deploy Preflight
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 检查部署密钥是否配置
        id: check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "部署密钥已配置，将继续部署。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=部署已跳过::未配置 SERVER_HOST / SERVER_USER / SERVER_SSH_KEY，本次不执行部署。镜像已构建并推送到 GHCR。"
          fi

  # ========== 部署 ==========
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-preflight.outputs.ready == 'true'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/zhikangyun
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans
            echo "Deployment completed at $(date)"
