# ============================================
# 智康云 - GitHub Actions CI/CD 流水线
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== 后端构建 ==========
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./后端/personal-health-api
        run: mvn clean compile -B

      - name: Run tests
        working-directory: ./后端/personal-health-api
        run: mvn test -B

      - name: Package JAR
        working-directory: ./后端/personal-health-api
        run: mvn package -DskipTests -B

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 后端/personal-health-api/target/*.jar
          retention-days: 7

  # ========== 前端构建 ==========
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 前端/personal-heath-view/package-lock.json

      - name: Install dependencies
        working-directory: ./前端/personal-heath-view
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Lint
        working-directory: ./前端/personal-heath-view
        # ENG-05 整改：原 continue-on-error 让 lint 永远"假通过"。
        # 当前代码库从未 lint 过（44 errors / 23102 warnings，多为 CRLF 与 prettier 格式问题），
        # 直接阻塞流水线会让 CI 完全不可用。折中：先 --fix 自动修复，
        # 剩余 error 超出阈值则失败——后续逐步清零后收紧为 --max-warnings 0。
        run: npm run lint -- --fix --max-warnings 30000

      - name: Build
        working-directory: ./前端/personal-heath-view
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 前端/personal-heath-view/dist/
          retention-days: 7

  # ========== Docker 构建 ==========
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: 后端/personal-health-api/target/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: 前端/personal-heath-view/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./前端/personal-heath-view
          file: ./前端/personal-heath-view/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 部署 ==========
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/zhikangyun
            git pull origin main
            docker-compose pull
            docker-compose up -d --remove-orphans
            echo "Deployment completed at $(date)"
